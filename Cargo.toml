[workspace]
resolver = "2"
members = [
  "crates/probe-contracts",
  "crates/probe-core",
  "crates/probe-measurements",
  "crates/probe-platform-macos",
  "crates/probe-redaction",
  "crates/tivor-probe-cli",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "Apache-2.0"
rust-version = "1.85"
repository = "https://github.com/tivornet/open-probe"

[workspace.dependencies]
anyhow = "1.0"
base64 = "0.22"
clap = { version = "4.5", features = ["derive"] }
getrandom = "0.3"
httparse = "1.10"
jsonschema = { version = "0.29", default-features = false }
regex = "1.11"
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12"] }
rustls-pki-types = "1.12"
rustls-platform-verifier = "0.7.1"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
sha1 = "0.10"
thiserror = "2.0"
tokio = { version = "1.48", features = ["io-util", "macros", "net", "rt-multi-thread", "sync", "time"] }
tokio-rustls = { version = "0.26", default-features = false, features = ["ring", "tls12"] }

[workspace.dependencies.rcgen]
version = "0.14"
default-features = false
features = ["crypto", "pem", "ring"]

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
all = "deny"
