name: Bug report
description: Report reproducible Open Probe behavior without attaching private results.
title: "[Bug]: "
labels: [bug, triage]
body:
  - type: markdown
    attributes:
      value: Never paste credentials, tokens, cookies, exact IPs, hostnames, or unredacted probe output.
  - type: input
    id: version
    attributes: { label: Version, placeholder: "tivor 0.1.0-beta.1" }
    validations: { required: true }
  - type: dropdown
    id: platform
    attributes: { label: Platform, options: ["macOS 13+ Apple Silicon", "Unsupported platform"] }
    validations: { required: true }
  - type: textarea
    id: behavior
    attributes: { label: Observed behavior, description: Use only redacted evidence. }
    validations: { required: true }
  - type: textarea
    id: reproduce
    attributes: { label: Reproduction steps }
    validations: { required: true }
  - type: checkboxes
    id: privacy
    attributes:
      label: Privacy check
      options:
        - label: I removed credentials, tokens, cookies, exact IPs, hostnames, and unredacted output.
          required: true
